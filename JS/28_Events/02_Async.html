<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Async deep dive</title>
  </head>
  <body>
    <h1>Async Programming</h1>
    <button id="stop">Stop</button>
  </body>
  <script>
    const jsCool = () => {
      console.log("Javascript is very cool");
    };
    const changeText = () => {
      document.querySelector("h1").innerHTML = "Js is single threaded";
    };
    setTimeout(jsCool, 2000);
    const changeMe = setTimeout(changeText, 3000);
    document.querySelector("#stop").addEventListener("click", () => {
      clearInterval(changeMe);
      console.log("STOPPED!");
    });
  </script>
</html>
